# Google Form responses → VW Melrose automation sheet.
# Intake headers are the live Form question titles (row 1).
# Destination headers are the TSV contract the Melrose loader already reads.

intake:
  spreadsheet_id: 1P7J0CipLKDvPjeLWiKSxuC8ZeWSAjzhbDsQwKFwWH6M
  headers_file: config/intake-form-headers.tsv

destination:
  spreadsheet_id: 12uKI418JWRhns8GQpWF1ACxlKc_zN-FcXL0NC_afMZI
  spreadsheet_url: https://docs.google.com/spreadsheets/d/12uKI418JWRhns8GQpWF1ACxlKc_zN-FcXL0NC_afMZI/edit?gid=0#gid=0
  gid: 0
  headers_file: config/output-sheet-headers.tsv
  loaded_clients_spreadsheet_id: 1V8re1qmdC0AXyDKt9G3gQxcqmn3q9hAJeM_YpUkjRLM
  # LLM / writer must emit exactly this many cells, in this order, one row, no extra columns.
  column_count: 38

# Form question keys (newlines in live headers are collapsed for matching via normalizeHeader).
intake_columns:
  - timestamp
  - vehicle_interest
  - name_and_surname
  - email
  - call_phone
  - whatsapp_phone
  - gender
  - highest_education
  - street_address
  - province
  - city_town
  - years_at_address
  - employer_name
  - job_title
  - years_at_employer
  - gross_monthly
  - nett_monthly
  - bank_name
  - next_of_kin_name
  - next_of_kin_surname
  - next_of_kin_phone
  - expenses_summary
  - expense_food
  - expense_cellphone
  - expense_accounts
  - id_number
  - consent
  - marital_status
  - spouse_name
  - spouse_number
  - employment
  - nok_relationship
  - max_price

