# Exact live output-sheet header row (gid=0). Order is the contract.
destination_columns:
  - NR
  - Full name
  - Email
  - Title
  - First names + surname
  - ID Type
  - ID number
  - Educational level
  - Mobile number
  - Address line
  - Postal code
  - Province
  - Year start living at address (MM DD YYYY format ONLY)
  - Next of kin name + Surname
  - Next of kin cellphone number
  - Industry (AI based on employer)
  - Occupation
  - Employee level
  - Employer name
  - Employer telephone number (online search)
  - Employer street address (online search)
  - Employer postal code (online search)
  - Employer province (online search)
  - Year they started working there (calculate from years provided)
  - Gross monthly salary
  - Nett salary
  - Telephone payment
  - Transport cost
  - Food cost
  - Bank name
  - Account type (AI—most likely option based on bank)
  - Account holder name and surname (same as client)
  - Client cellphone number (add again at the end)
  - Marital status
  - Next of kin relationship
  - Max price range
  - Status
  - Timing

# copy = pass through (normalise only). infer = LLM / search / standing prompt rules.
# writer = filled by the sheet writer / Melrose loader, not by Gemini.
field_map:
  - destination: NR
    mode: writer
    notes: Next integer after the last data row (row 2 = 1). Do not let the LLM invent NR.

  - destination: Full name
    source: name_and_surname
    mode: copy

  - destination: Email
    source: email
    mode: copy

  - destination: Title
    source: gender
    mode: copy
    notes: Derived in code from Gender (Male→Mr, Female→Ms). Empty gender is an error.

  - destination: First names + surname
    source: name_and_surname
    mode: copy

  - destination: ID Type
    source: id_number
    mode: copy
    notes: Set in code to "RSA ID" when the ID is 13 digits. Never invent an ID.

  - destination: ID number
    source: id_number
    mode: copy
    notes: Strip spaces. Never invent.

  - destination: Educational level
    source: highest_education
    mode: copy

  - destination: Mobile number
    sources: [whatsapp_phone, call_phone]
    mode: copy
    notes: Prefer WhatsApp number; else call number. 10 digits starting with 0 (+27 → 0). Empty if the Form has no phone.

  - destination: Address line
    source: street_address
    mode: copy

  - destination: Postal code
    sources: [street_address, city_town, province]
    mode: infer
    notes: Infer from address + city via search/geo. Unknown if not found.

  - destination: Province
    source: province
    mode: copy

  - destination: Year start living at address (MM DD YYYY format ONLY)
    source: years_at_address
    mode: infer
    notes: If "X years/months living there", calculate from today as MM DD YYYY. Never use the ID date of birth.

  - destination: Next of kin name + Surname
    sources: [next_of_kin_name, next_of_kin_surname]
    mode: copy
    notes: Combined in code from separate Form name + surname columns.

  - destination: Next of kin cellphone number
    source: next_of_kin_phone
    mode: copy
    notes: Copy the Form next-of-kin number only. Do not reuse the client's number.

  - destination: Industry (AI based on employer)
    source: employer_name
    mode: infer

  - destination: Occupation
    source: job_title
    mode: copy

  - destination: Employee level
    sources: [job_title, employer_name]
    mode: infer

  - destination: Employer name
    source: employer_name
    mode: copy

  - destination: Employer telephone number (online search)
    sources: [employer_name, city_town, province, street_address]
    mode: infer
    notes: Infer from employer + location. Leave empty if not found — do not copy the client mobile.

  - destination: Employer street address (online search)
    sources: [employer_name, city_town, province, street_address]
    mode: infer
    notes: Infer from employer + location. Leave empty if not found — do not copy the home address.

  - destination: Employer postal code (online search)
    sources: [employer_name, city_town, province]
    mode: infer
    notes: Infer from employer + location. Leave empty if not found — do not copy the home postal code.

  - destination: Employer province (online search)
    sources: [employer_name, province]
    mode: infer
    notes: Infer from employer + client province context. Leave empty if not found — do not copy the home province.

  - destination: Year they started working there (calculate from years provided)
    source: years_at_employer
    mode: infer
    notes: If "X years/months", calculate start date as MM DD YYYY.

  - destination: Gross monthly salary
    source: gross_monthly
    mode: copy
    notes: Never invent salary figures.

  - destination: Nett salary
    source: nett_monthly
    mode: copy
    notes: Never invent salary figures.

  - destination: Telephone payment
    sources: [expense_cellphone, expenses_summary]
    mode: infer
    notes: Prefer dedicated cellphone-spend Form column when present; else infer from expenses summary.

  - destination: Transport cost
    sources: [expense_accounts, expenses_summary]
    mode: infer
    notes: Prefer dedicated accounts-spend Form column when present (Seriti's third expense bucket); else infer transport/household from expenses summary.

  - destination: Food cost
    sources: [expense_food, expenses_summary]
    mode: infer
    notes: Prefer dedicated food-spend Form column when present; else infer from expenses summary.

  - destination: Bank name
    source: bank_name
    mode: copy

  - destination: Account type (AI—most likely option based on bank)
    source: bank_name
    mode: copy
    notes: Mapped in code from Bank name (Capitec/Discovery=Savings/Transactional; FNB/ABSA/Nedbank/Standard/Investec=Cheque/Current).

  - destination: Account holder name and surname (same as client)
    source: name_and_surname
    mode: copy

  - destination: Client cellphone number (add again at the end)
    sources: [whatsapp_phone, call_phone]
    mode: copy
    notes: Same value as Mobile number.

  - destination: Marital status
    source: marital_status
    mode: copy
    notes: Copy from the Form when present. If blank, code sets Married when a spouse is given, else Single.

  - destination: Next of kin relationship
    source: nok_relationship
    mode: copy
    notes: Copy from the Form when present. If blank, standing default is Distant (Seriti requires a value).

  - destination: Max price range
    mode: copy
    notes: Standing rule — always 300000 (R300 000). Not taken from the Form.

  - destination: Status
    mode: writer
    notes: Leave blank on insert. Melrose loader writes ZAHTVW… or error here; blank means "not loaded yet".

  - destination: Timing
    mode: writer
    notes: Leave blank on insert. Melrose loader writes elapsed seconds after a successful load.

passthrough_not_on_destination:
  - timestamp
  - vehicle_interest
  - consent
  - gender
  - spouse_name
  - spouse_number
  - employment
  - expense_accounts

rules:
  - Output must be exactly 38 columns in destination_columns order. No extra headings, notes, or columns.
  - LLM fills infer columns only. Copy columns come from the Form in code. Writer sets NR; Status and Timing stay empty so the Melrose loader picks the row up.
  - Never invent ID numbers, salary figures, names, addresses, or phone numbers.
  - Copy-mode columns are filled from the Form in code. Gemini only fills infer columns.
  - Never output Gender on the destination sheet.
  - Dates must be MM DD YYYY. Prefer calculating from "X years/months" in code.
  - If an infer value cannot be determined, leave it empty (not the client's name or home address).
  - Title, marital status, next-of-kin relationship, industry, occupation, and employee level must come from the intake sheet (or a deterministic mapping of an intake field). Missing marital defaults to Married if a spouse is present, else Single. Max price is always 300000.
  - Do not load a row when consent is not given.
  - Single-line cells only (no line breaks inside addresses or names).
