# Manual operator trigger + daily schedule. No Cursor agent.
# Actions → Intake to Melrose → Run workflow
#
# One job: Gemini ingest then Seriti load (same runner, Playwright installed once).
# On schedule, workflow_dispatch inputs are empty — defaults below keep the backlog capped.

name: Intake to Melrose

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = Gemini then Seriti; ingest-only = Gemini to automation sheet; load-only = Seriti for blank Status"
        type: choice
        options:
          - full
          - ingest-only
          - load-only
        default: full
      maxIntakeRows:
        description: "Max unprocessed Form rows to enrich this run. Default 5. Use 0 only if you intend to process the whole backlog."
        required: false
        default: "5"
      rowFilter:
        description: "load-only: automation sheet row numbers (comma-separated). Leave blank for every empty Status row."
        required: false
        default: ""
      dryRun:
        description: "Gemini mapping only — do not write sheets or open Seriti"
        type: boolean
        default: false
  schedule:
    # 06:00 UTC daily. GitHub disables schedules after 60 days without repo activity.
    - cron: "0 6 * * *"

concurrency:
  group: hatfield-pipeline
  cancel-in-progress: false

env:
  SHEET_CSV_URL: https://docs.google.com/spreadsheets/d/12uKI418JWRhns8GQpWF1ACxlKc_zN-FcXL0NC_afMZI/gviz/tq?tqx=out:csv&gid=0
  SHEET_ID: 12uKI418JWRhns8GQpWF1ACxlKc_zN-FcXL0NC_afMZI
  INTAKE_SPREADSHEET_ID: 1qzp0v1_lHzAUj7TGXIj-cz0zuWctBX8de1wR46hKcLY
  INTAKE_SHEET_GID: "880063023"
  INTAKE_SHEET_NAME: "Willem/ Sihle"
  HEADLESS: "true"

jobs:
  pipeline:
    name: Intake to Melrose
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        if: ${{ (github.event_name == 'schedule' || github.event.inputs.mode != 'ingest-only') && (github.event_name == 'schedule' || github.event.inputs.dryRun != 'true') }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: ${{ (github.event_name == 'schedule' || github.event.inputs.mode != 'ingest-only') && (github.event_name == 'schedule' || github.event.inputs.dryRun != 'true') }}
        run: npx playwright install --with-deps chromium
      - name: Enrich Form rows onto the automation sheet
        if: ${{ github.event_name == 'schedule' || github.event.inputs.mode != 'load-only' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          # schedule has empty inputs — force safe defaults (never process the whole backlog).
          MODE: ${{ github.event.inputs.mode || 'full' }}
          MAX_INTAKE_ROWS: ${{ github.event.inputs.maxIntakeRows || '5' }}
          DRY_RUN: ${{ github.event.inputs.dryRun || 'false' }}
        run: |
          set -euo pipefail
          echo "mode=${MODE} maxIntakeRows=${MAX_INTAKE_ROWS} dryRun=${DRY_RUN} event=${{ github.event_name }}"
          AUTO_LOAD=false npm run ingest
      # Rebuild blank-Status rows through deterministic Seriti maps + employer search
      # so free-text Gemini leftovers never reach the loader.
      - name: Repair blank-Status rows (Seriti maps + employer phone search)
        if: ${{ (github.event_name == 'schedule' || github.event.inputs.mode != 'load-only') && (github.event_name == 'schedule' || github.event.inputs.dryRun != 'true') }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
        run: npx tsx src/repairBlankRows.ts
      - name: Load blank-Status rows into Seriti
        if: ${{ (github.event_name == 'schedule' || github.event.inputs.mode != 'ingest-only') && (github.event_name == 'schedule' || github.event.inputs.dryRun != 'true') }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          MODE: ${{ github.event.inputs.mode || 'full' }}
          ROW_FILTER: ${{ github.event.inputs.rowFilter || '' }}
          DRY_RUN: ${{ github.event.inputs.dryRun || 'false' }}
        run: |
          set -euo pipefail
          echo "mode=${MODE} dryRun=${DRY_RUN} rowFilter=${ROW_FILTER:-}"
          AUTO_LOAD=true npm run dev
