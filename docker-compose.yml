services:
  product:
    build: .
    ports:
      - "${PRODUCT_PORT:-8787}:8787"
    env_file:
      - .env
    environment:
      HEADLESS: "true"
      PRODUCT_PORT: "8787"
      CLIENTS_DIR: /app/clients
      PRODUCT_DATA_DIR: /app/data/product
    volumes:
      - ./clients:/app/clients
      - ./data:/app/data
      - ./mapping.json:/app/mapping.json:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
